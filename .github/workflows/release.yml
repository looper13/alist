name: release

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        platform: [ubuntu-latest]
        target:
          - windows-amd64
          - linux-amd64
    name: Release
    runs-on: ${{ matrix.platform }}
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: looper13/alist-web
          ref: main
          path: alist-web
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: alist-web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: alist-web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Embed frontend dist
        run: |
          rm -rf public/dist
          cp -R alist-web/dist public/dist

      - name: Build
        uses: go-cross/cgo-actions@v1
        with:
          targets: ${{ matrix.target }}
          musl-target-format: $os-$musl-$arch
          out-dir: build
          x-flags: |
            github.com/alist-org/alist/v3/internal/conf.BuiltAt=$built_at
            github.com/alist-org/alist/v3/internal/conf.GitAuthor=Xhofe
            github.com/alist-org/alist/v3/internal/conf.GitCommit=$git_commit
            github.com/alist-org/alist/v3/internal/conf.Version=$tag
            github.com/alist-org/alist/v3/internal/conf.WebVersion=$tag

      - name: Compress
        run: bash build.sh zip md5

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: build/compress/*
